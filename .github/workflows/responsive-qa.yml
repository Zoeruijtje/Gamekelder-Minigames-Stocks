name: Responsive QA

on:
  pull_request:
  push:
    branches:
      - main
      - feat/full-gamekelder-site
      - preview

permissions:
  contents: read

jobs:
  responsive-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run responsive regression suite
        run: python tests/test_responsive.py --screenshots

      - name: Upload browser artifacts when the test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
