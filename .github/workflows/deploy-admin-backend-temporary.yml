name: Deploy admin backend temporary

on:
  push:
    branches: [feat/market-experience-rls-hardening]
    paths:
      - ".github/workflows/deploy-admin-backend-temporary.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: knndezzbjzcykysasfnw
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate repository deployment secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'SUPABASE_DB_PASSWORD is not configured'; exit 1; }
      - name: Build a bounded migration workdir
        run: |
          mkdir -p .backend-deploy/supabase/migrations
          cp supabase/config.toml .backend-deploy/supabase/config.toml
          cp supabase/migrations/20260825133000_friend_exchange_admin_control_center.sql .backend-deploy/supabase/migrations/
      - name: Link existing Free Plan project
        run: supabase --workdir .backend-deploy link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply only the reviewed admin migration
        run: supabase --workdir .backend-deploy db push --linked
