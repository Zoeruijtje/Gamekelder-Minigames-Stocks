name: Apply admin control center bundle

on:
  push:
    branches: [feat/admin-control-center-navigation]
    paths:
      - ".admin-bundle/**"
      - ".github/workflows/apply-admin-bundle.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct reviewed source bundle
        run: |
          cat .admin-bundle/part-* | base64 --decode > /tmp/admin-control-center.tar.gz
          tar -xzf /tmp/admin-control-center.tar.gz -C .
          rm -rf .admin-bundle .github/workflows/apply-admin-bundle.yml
      - name: Commit reviewed implementation
        run: |
          git config user.name "Zoeruijtje"
          git config user.email "120500701+Zoeruijtje@users.noreply.github.com"
          git add -A
          git commit -m "feat: add session navigation and admin control center"
          git push origin HEAD:feat/admin-control-center-navigation
