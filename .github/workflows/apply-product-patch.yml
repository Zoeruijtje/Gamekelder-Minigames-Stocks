name: Apply staged Friend Exchange product patch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-friend-exchange-product-patch
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.head_ref == 'feat/free-supabase-market-refinement' || github.ref_name == 'feat/free-supabase-market-refinement'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/free-supabase-market-refinement
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Reconstruct and apply the bounded patch
        run: |
          cat .patch/parts/patch.* > /tmp/gamekelder-patch.tar.gz.b64
          test "$(wc -c < /tmp/gamekelder-patch.tar.gz.b64)" -eq 50204
          echo "31dea0ded98f12015e100e13ca84e653ca37fda8c601b8c6e2f1dd93354dd3d3  /tmp/gamekelder-patch.tar.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/gamekelder-patch.tar.gz.b64 > /tmp/gamekelder-patch.tar.gz
          echo "3b74a957b6771866bf08ad8e72a49526ef7e973a3330e2f3eb31af7fe9c53cc3  /tmp/gamekelder-patch.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gamekelder-patch.tar.gz --directory .
          cat >> online.css <<'CSS'

          /* Market settlement prices remain visible on every controller size. */
          @media(max-width:980px){
            .market-result-row{
              grid-template-columns:30px 34px minmax(0,1fr) 135px;
              grid-template-areas:
                "rank avatar player move"
                ". . prices prices";
              row-gap:7px;
            }
            .market-result-rank{grid-area:rank}
            .market-result-avatar{grid-area:avatar}
            .market-result-player{grid-area:player}
            .market-result-prices{
              grid-area:prices;
              display:grid;
              grid-template-columns:max-content auto max-content;
              justify-content:end;
              min-width:0;
              padding-top:6px;
              border-top:1px solid rgba(255,255,255,.055);
            }
            .market-result-move{grid-area:move}
          }
          @media(max-width:620px){
            .market-result-row{
              grid-template-columns:28px 32px minmax(0,1fr) 92px;
              grid-template-areas:
                "rank avatar player move"
                ". prices prices prices";
            }
            .market-result-prices{
              justify-content:start;
              width:100%;
            }
            .market-result-prices b{font-size:18px}
          }
          CSS
          rm -rf .patch

      - name: Install browser test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Verify syntax, engines and browser flows
        run: |
          npm run check
          npm run test:unit
          npm run test:browser

      - name: Commit the verified product patch
        env:
          BRANCH: feat/free-supabase-market-refinement
        run: |
          git config user.name "Friend Exchange QA Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/apply-product-patch.yml
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch changes found"; exit 1; }
          git commit -m "feat: add free online rooms and visible market settlement"
          git push origin HEAD:"$BRANCH"

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staged-product-patch-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
