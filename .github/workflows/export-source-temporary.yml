name: Export source temporary

on:
  push:
    branches: [feat/market-experience-rls-hardening]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: tar -czf /tmp/gamekelder-source.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: gamekelder-source
          path: /tmp/gamekelder-source.tar.gz
          retention-days: 1
