name: Product QA

on:
  pull_request:
  push:
    branches: [main, feat/full-product-mvp]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install browser test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: JavaScript syntax and unit tests
        run: |
          npm run check
          npm run test:unit
      - name: Browser regression and full round flow
        run: npm run test:browser
      - name: Verify image dimensions and source quality
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {
              'assets/gamekelder-bg.webp': (1536, 864, 150_000),
              'assets/gamekelder-bg-mobile.webp': (1080, 1920, 90_000),
          }
          for filename, (width, height, minimum) in expected.items():
              path = Path(filename)
              image = Image.open(path)
              assert image.size == (width, height), (filename, image.size)
              assert path.stat().st_size >= minimum, (filename, path.stat().st_size)
              print('PASS', filename, image.size, path.stat().st_size)
          PY
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-qa-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
